apps:
  - name: 'web-server'
    script: './http-server.js'
    cwd: '/app'
    env:
      NODE_ENV: 'production'

  - name: 'game-lobby'
    script: './server.cjs'
    cwd: '/app'
    env:
      NODE_ENV: 'production'

  - name: 'fs-server'
    # 对应 packages/fs/package.json 中的 serve 命令
    script: './packages/fs/dist/entry.cjs'
    cwd: '/app'
    env:
      NODE_ENV: 'production'
      # 确保它监听 8089 (通常是默认值，如有需要可配置)
      PORT: 8089