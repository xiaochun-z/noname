apps:
  - name: 'web-server'
    script: './http-server.js'
    cwd: '/app'
    env:
      NODE_ENV: 'production'

  - name: 'game-lobby'
    script: './server.cjs'
    cwd: '/app'
    env:
      NODE_ENV: 'production'

  - name: 'fs-server'
    # 对应 packages/fs/package.json 中的 serve 命令
    script: './packages/fs/dist/entry.cjs'
    cwd: '/app'
    env:
      NODE_ENV: 'production'
      PORT: 8089

  - name: 'ws-server'
    script: './packages/server/dist/index.cjs'
    cwd: '/app'
    env:
      NODE_ENV: 'production'
      PORT: 8082